[project]
name = "zeus-score"
version = "1.5.0"
description = "Score a reading of a manuscript's staves with an OMR model (Zeus or a MuSViT reader) trained on Boccherini's copyists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zeus-score = "zeus_score.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zeus_score"]

# The scoring code is the labeler's own, copied in when the package is built
# (hatch_build.py), so there is one copy of it. It runs in an environment of
# its own (its PEP 723 header pins Python 3.10, Zeus and tensorflow), which
# the launcher starts with uv.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["zeus_score", "hatch_build.py", "README.md", "MODEL_CARD.md"]
